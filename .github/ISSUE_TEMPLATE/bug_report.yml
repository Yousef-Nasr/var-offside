name: Bug report
description: Something crashes, errors or doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a decision you think is wrong, use the **Wrong call** template instead.
        Please don't attach broadcast footage unless you have the right to share it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start `var-offside-web`
        2. Load a frame and press Detect
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: The traceback or the relevant lines from the server window.
      render: text
  - type: textarea
    id: setup
    attributes:
      label: Output of `python scripts/verify_setup.py`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VAR-Offside version or commit
      placeholder: 0.1.0 or a commit hash
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
